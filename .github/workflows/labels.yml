name: Label Sync

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/labels.yml"
  pull_request:
    paths:
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  reusable:
    uses: groundsgg/.github/.github/workflows/label-sync.yml@main
