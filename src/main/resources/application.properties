quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.auth.proactive=false
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/app?currentSchema=permissions}
quarkus.datasource.username=${POSTGRES_USER:app}
quarkus.datasource.password=${POSTGRES_PASSWORD:app}
# Agroal pool gauges on /q/metrics: agroal_active_count, agroal_available_count,
# agroal_awaiting_count. This is the signal that a pool is running out — without
# it, exhaustion only shows up as services crash-looping at startup.
# BUILD_AND_RUN_TIME_FIXED: it cannot be switched on with an env var later.
quarkus.datasource.jdbc.metrics.enabled=true
# Fail a starved checkout within the runtime clients' 2 s budget instead of
# finishing after the client has hung up (Agroal default: 5 s).
quarkus.datasource.jdbc.acquisition-timeout=2S
# Stage reaches PostgreSQL through a TCP tunnel that drops quiet connections, and
# a dropped connection used unvalidated fails with "This connection has been
# closed". Validate a connection on borrow once it has been idle for 30 s (busy
# connections skip the extra round trip), drop idle connections sooner and
# recycle long-lived ones.
quarkus.datasource.jdbc.foreground-validation-interval=30S
quarkus.datasource.jdbc.idle-removal-interval=1M
quarkus.datasource.jdbc.max-lifetime=10M

quarkus.flyway.schemas=permissions
quarkus.flyway.migrate-at-start=true

quarkus.application.name=service-permissions
quarkus.application.version=${QUARKUS_APPLICATION_VERSION:dev}
quarkus.smallrye-openapi.info-title=Permissions API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.store-schema-directory=build/generated/openapi
quarkus.smallrye-openapi.store-schema-file-name=openapi
quarkus.smallrye-openapi.auto-add-security=false
quarkus.swagger-ui.enabled=false
quarkus.swagger-ui.always-include=false
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.observability.svc.cluster.local:4317}

%prod.mp.jwt.verify.issuer=${PERMISSIONS_JWT_ISSUER}
%prod.mp.jwt.verify.publickey.location=${PERMISSIONS_JWT_PUBLIC_KEY_LOCATION}
permissions.forge.base-url=${PERMISSIONS_FORGE_BASE_URL:http://localhost:8081}
permissions.instance-environment=${PERMISSIONS_INSTANCE_ENVIRONMENT:}
permissions.runtime.review-cache.positive-ttl=60s
permissions.runtime.review-cache.maximum-entries=1024
quarkus.rest-client.keycloak-admin.url=${PERMISSIONS_KEYCLOAK_URL:http://localhost:8080}
permissions.keycloak.realm=${PERMISSIONS_KEYCLOAK_REALM:grounds}
permissions.keycloak.client-id=${PERMISSIONS_KEYCLOAK_CLIENT_ID:service-permissions}
permissions.keycloak.client-secret=${PERMISSIONS_KEYCLOAK_CLIENT_SECRET:}
permissions.identity-sync.page-size=${PERMISSIONS_IDENTITY_SYNC_PAGE_SIZE:100}
permissions.identity-sync.enabled=${PERMISSIONS_IDENTITY_SYNC_ENABLED:true}
permissions.identity-sync.schedule=${PERMISSIONS_IDENTITY_SYNC_SCHEDULE:30m}
permissions.identity-sync.max-staleness=${PERMISSIONS_IDENTITY_SYNC_MAX_STALENESS:6h}
permissions.mojang.base-url=${PERMISSIONS_MOJANG_BASE_URL:https://api.mojang.com}
permissions.mojang.timeout=${PERMISSIONS_MOJANG_TIMEOUT:2s}
permissions.mojang.cache-ttl=${PERMISSIONS_MOJANG_CACHE_TTL:5m}
permissions.mojang.cache-max-entries=${PERMISSIONS_MOJANG_CACHE_MAX_ENTRIES:512}
permissions.identity-events.enabled=${PERMISSIONS_IDENTITY_EVENTS_ENABLED:true}
permissions.identity-events.nats-url=${PERMISSIONS_IDENTITY_EVENTS_NATS_URL:nats://localhost:4222}
permissions.identity-events.subject=${PERMISSIONS_IDENTITY_EVENTS_SUBJECT:minecraft-identity.changed}
permissions.identity-events.stream=${PERMISSIONS_IDENTITY_EVENTS_STREAM:MINECRAFT_IDENTITY}
permissions.identity-events.consumer-prefix=${PERMISSIONS_IDENTITY_EVENTS_CONSUMER_PREFIX:service-permissions}
permissions.identity-events.consumer=${PERMISSIONS_IDENTITY_EVENTS_CONSUMER:}
permissions.identity-events.retry-delay=${PERMISSIONS_IDENTITY_EVENTS_RETRY_DELAY:5s}
permissions.identity-events.max-deliveries=${PERMISSIONS_IDENTITY_EVENTS_MAX_DELIVERIES:10}
permissions.snapshot-invalidations.enabled=${PERMISSIONS_SNAPSHOT_INVALIDATIONS_ENABLED:true}
permissions.snapshot-invalidations.subject=${PERMISSIONS_SNAPSHOT_INVALIDATIONS_SUBJECT:permissions.snapshot.invalidated}
# Snapshot cache. Global definitions are reloaded when the policy version changes;
# player rows live in L1 for player-ttl and are evicted by local writes, the
# policy-version poll and (when enabled) invalidations received over NATS.
permissions.snapshot-cache.player-ttl=${PERMISSIONS_SNAPSHOT_CACHE_PLAYER_TTL:60s}
permissions.snapshot-cache.max-players=${PERMISSIONS_SNAPSHOT_CACHE_MAX_PLAYERS:10000}
permissions.snapshot-cache.max-concurrent-loads=${PERMISSIONS_SNAPSHOT_CACHE_MAX_CONCURRENT_LOADS:2}
permissions.snapshot-cache.poll-interval=${PERMISSIONS_SNAPSHOT_CACHE_POLL_INTERVAL:2s}
# Needs subscribe permission on the invalidation subject for the NATS user.
permissions.snapshot-cache.nats-invalidations.enabled=${PERMISSIONS_SNAPSHOT_CACHE_NATS_INVALIDATIONS_ENABLED:false}
# Optional regional L2 (Valkey). Off unless explicitly enabled.
permissions.snapshot-cache.valkey.enabled=${PERMISSIONS_SNAPSHOT_CACHE_VALKEY_ENABLED:false}
permissions.snapshot-cache.valkey.ttl=${PERMISSIONS_SNAPSHOT_CACHE_VALKEY_TTL:5m}
permissions.snapshot-cache.valkey.timeout=${PERMISSIONS_SNAPSHOT_CACHE_VALKEY_TIMEOUT:100ms}
quarkus.redis.hosts=${PERMISSIONS_SNAPSHOT_CACHE_VALKEY_URL:redis://localhost:6379}
# The L2 is optional, so Valkey must never fail readiness, and tests bring their own.
quarkus.redis.health.enabled=false
quarkus.redis.devservices.enabled=false

%test.permissions.keycloak.client-secret=test-secret
%test.permissions.identity-sync.enabled=false
%test.permissions.identity-events.enabled=false
%test.permissions.snapshot-invalidations.enabled=false
